name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  type-check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      # 分层门禁：先跑快速逻辑面（纯逻辑/API/状态/hooks），最快暴露回归；
      # 通过后再跑全量（含 jsdom 组件测试）与覆盖率门槛。
      - name: Fast logic lane
        run: npm run test:unit:logic

      - name: Full unit tests + coverage
        run: npm run test:coverage
