name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  type-check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      # 【2026-09-10 去重】此处原有一个 `Fast logic lane`（npm run test:unit:logic），
      # 排在 test:coverage 之前「先跑快速面暴露回归」。实测该分层收益不成立，已删除：
      #   · test:unit:logic 的 1932 个用例是 test:coverage（2332）的**真子集**，属纯重复执行；
      #   · 耗时仅省 13.5s vs 19.0s —— 因为瓶颈是 vitest 的收集/初始化开销，不是 .tsx 组件数；
      #   · 一旦逻辑面失败 CI 立刻红（少跑 5.5s 无意义），通过则还要再跑 19s，
      #     总时长反而变成 32.5s。故合并为单条 test:coverage，语义等价且更快。
      # 本地仍可单独用 npm run test:unit:logic 做开发期快速定向（该配置本身保留）。
      - name: Full unit tests + coverage
        run: npm run test:coverage

  # localTool（本地工具服务）此前完全没有门禁：源码改坏类型/逻辑时 CI 全绿。
  # 独立 job 与前端并行，锁文件与缓存均指向 localTool/package-lock.json。
  localtool:
    name: localTool (type-check + build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与前端 job 统一 Node 20。注意：localTool 测试用了 node:test 的 mock.timers
      # （20.4.0+ 才有，20.x 上属实验特性），故 Node 不得低于 20.4。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: localTool/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: localTool

      # build = tsc --noEmit + esbuild 打包，同时守住「类型正确」与「可打包」两条底线。
      - name: Type check + build
        run: npm run build
        working-directory: localTool

      # 测试直接 import src/*.ts（经 tsx 装载），无需先编译，故必须与 build 分开跑。
      - name: Tests
        run: npm test
        working-directory: localTool
