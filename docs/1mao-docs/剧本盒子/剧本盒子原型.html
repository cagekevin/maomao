<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>剧本盒子节点 · UI 对齐原型（基于线上截图）</title>
<style>
  :root{
    --bg:#0e0e0e; --panel:#1c1c1c; --field:#262626; --field2:#242424;
    --hover:#2a2a2a; --hover2:#333; --line:#3a3a3a; --line2:#333;
    --text:#e5e5e5; --dim:#9ca3af; --mute:#6b7280;
    --accent:#fff; --blue:#93c5fd; --red:#f87171; --green:#34d399; --purple:#c4b5fd;
    --cyan:#67e8f9; --radius:20px;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#191919,#0e0e0e 60%);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .canvas{min-height:100vh;display:flex;justify-content:center;padding:48px 24px;
    background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);background-size:22px 22px}
  .node{width:1100px;max-width:98vw;background:var(--panel);border:1px solid rgba(255,255,255,.1);
    border-radius:var(--radius);box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden;position:relative}
  .hd{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
  .hd .ic{width:18px;height:18px;color:var(--mute)}
  .hd .title{font-size:13px;color:#d4d4d4;font-weight:500}
  .hd .spacer{flex:1}
  .hdbtn{font-size:11px;color:var(--dim);background:transparent;border:0;cursor:pointer;padding:4px 7px;border-radius:7px}
  .hdbtn:hover{background:var(--hover2);color:#fff}
  .glyph{width:14px;height:14px;display:inline-block;vertical-align:middle}
  .genbadge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);background:var(--field);padding:4px 10px;border-radius:999px}
  .genbadge .spin{width:11px;height:11px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite}

  .steps{display:flex;align-items:center;justify-content:center;gap:0;padding:14px 18px 4px}
  .step{display:flex;align-items:center;gap:10px;border:0;background:transparent;cursor:pointer;padding:6px 12px;border-radius:14px;width:200px;text-align:left}
  .step.active{background:var(--hover)}
  .step:hover:not(.active){background:#222}
  .ring{position:relative;width:28px;height:28px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
  .step .t{font-size:12px;font-weight:500}.step .d{font-size:10px;color:var(--mute);margin-top:1px}
  .step.active .t{color:#fff}.step.active .d{color:var(--dim)}
  .step:not(.active) .t{color:var(--dim)}
  .bar{flex:1;height:1px;background:var(--line2);margin:0 14px}

  .view{padding:18px}
  .row{display:flex;gap:16px}
  .col{flex:1;min-width:0}
  .lab{font-size:11px;color:var(--mute);margin-bottom:6px}
  .story{width:100%;min-height:150px;resize:vertical;border-radius:16px;background:var(--field);
    border:1px solid var(--line);padding:12px 14px;font-size:14px;color:var(--text);outline:none;line-height:1.6}
  .story:focus{border-color:var(--dim)}
  .stylehead{display:flex;align-items:center;gap:6px}
  .styleinput{flex:1;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--text);outline:none}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{font-size:10px;padding:3px 8px;border-radius:8px;background:var(--field);color:var(--dim);cursor:pointer;border:1px solid transparent}
  .chip.on{background:var(--accent);color:#111}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .seg button{font-size:11px;padding:5px 9px;border-radius:9px;background:var(--field);color:var(--dim);border:0;cursor:pointer}
  .seg button.on{background:var(--accent);color:#111}
  .numwrap{display:flex;align-items:center;gap:4px;margin-top:4px}
  .numwrap input{width:72px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:11px;color:var(--text);outline:none}
  .modelwrap{position:relative}
  .modelbtn{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:5px 9px;border-radius:9px;background:var(--field);color:var(--dim);border:0;cursor:pointer}
  .modelbtn.on{background:var(--hover2);color:#fff}
  .menu{position:absolute;right:0;top:34px;z-index:40;width:260px;background:#202020;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .menu .mh{font-size:10px;color:var(--mute);padding:4px 6px;text-transform:uppercase;letter-spacing:.5px}
  .menu .mi{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;font-size:11px;padding:7px 8px;border-radius:8px;background:transparent;color:#ddd;border:0;cursor:pointer;text-align:left}
  .menu .mi:hover{background:var(--hover)}
  .menu .mi .bal{font-size:9px;color:var(--green)}
  .menu .detail{width:100%;text-align:right;font-size:10px;color:var(--blue);background:transparent;border:0;cursor:pointer;padding:6px 8px}
  .gen{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#111;font-size:13px;font-weight:600;cursor:pointer}
  .gen:hover{background:#e5e5e5}
  .progress{font-size:11px;color:var(--dim);margin-top:8px;text-align:center}

  /* ---- view1 table (right side) ---- */
  .tblwrap{flex:2.6;min-width:0;display:flex;flex-direction:column}
  .tblbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .tblbar .t{font-size:12px;color:#d4d4d4;font-weight:500}
  .tblbar .meta{font-size:10px;color:var(--mute)}
  /* 分镜 grid 表格（9 列） */
  .shot-grid-head,.shot-grid-row{display:flex;align-items:center;gap:0}
  .shot-grid-head{background:#222;border-radius:10px 10px 0 0;color:var(--mute);font-size:10px}
  .shot-grid-head .sg-col{padding:8px 8px;font-weight:500;white-space:nowrap}
  .shot-grid-row{border-bottom:1px solid #1f1f1f;min-height:52px;background:transparent}
  .shot-grid-row:hover{background:#202020}
  .shot-grid-row .sg-col{padding:4px 8px;vertical-align:top;min-width:0}
  .sg-col{flex:none;box-sizing:border-box}
  .cell-desc{color:#ddd;font-size:11px;line-height:1.5;cursor:text;min-height:40px}
  .cell-desc .at{color:var(--cyan);font-weight:500}
  .durinputwrap{display:inline-flex;align-items:center;gap:2px;font-size:10px;color:var(--mute)}
  .drop{position:relative}
  .dropbtn{width:100%;text-align:left;background:transparent;border:0;color:var(--dim);font-size:11px;cursor:pointer;padding:3px 4px;border-radius:6px}
  .dropbtn:hover{background:var(--hover)}
  .dropbtn.f{color:#ddd}
  .droplist{position:absolute;z-index:30;top:100%;left:0;margin-top:2px;background:#202020;border:1px solid var(--line);border-radius:8px;padding:4px;max-height:160px;overflow:auto;min-width:120px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .droplist div{padding:4px 8px;border-radius:6px;font-size:11px;color:#ddd;cursor:pointer}
  .droplist div:hover{background:var(--hover)}
  .durinput{width:46px;background:var(--field2);border:1px solid transparent;border-radius:6px;padding:3px 5px;font-size:11px;color:var(--text);outline:none}
  .rowops{display:flex;gap:4px;align-items:center}
  .rowops button{background:transparent;border:0;color:var(--mute);cursor:pointer;font-size:12px;padding:2px 3px;border-radius:5px}
  .rowops button:hover{background:var(--hover);color:#fff}
  .empty{text-align:center;padding:48px 0;color:var(--mute);font-size:12px;border:1px dashed var(--line);border-radius:12px}

  /* ---- view2 assets ---- */
  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .tb{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:7px 12px;border-radius:10px;border:0;cursor:pointer}
  .tb.dark{background:var(--hover);color:#ddd}.tb.dark:hover{background:var(--hover2)}
  .tb.light{background:var(--accent);color:#111}.tb.light:hover{background:#e5e5e5}
  .gstyle{flex:1;background:var(--field2);border:1px solid transparent;border-radius:10px;padding:9px 10px;font-size:12px;color:var(--text);outline:none}
  .gstyle:focus{border-color:var(--dim)}
  .catgroup{margin-bottom:16px}
  .catgroup .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .catgroup .ch .cn{font-size:12px;color:#d4d4d4;font-weight:500}
  .acatmodel{font-size:10px;padding:4px 8px;border-radius:8px;background:var(--field);color:var(--dim);border:0;cursor:pointer}
  .assets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .asset{background:#212121;border-radius:10px;overflow:hidden;border:1px solid transparent;cursor:pointer;position:relative}
  .asset.sel{border-color:#d4d4d4}
  .asset .thumb{aspect-ratio:1;background:linear-gradient(135deg,#2a2118,#1a1a1a);display:flex;align-items:center;justify-content:center;color:#555;font-size:10px;position:relative}
  .asset .thumb .ld{position:absolute;inset:0;background:rgba(20,20,20,.55);backdrop-filter:blur(1px);display:flex;align-items:center;justify-content:center;font-size:10px;color:#ddd}
  .asset .cap{font-size:10px;color:var(--dim);padding:5px 6px}
  .asset .cap b{display:block;font-size:11px;color:#e5e5e5;font-weight:500}
  .asset .thumb img{width:100%;height:100%;object-fit:cover}
  .asset .pick{position:absolute;top:4px;left:4px;width:14px;height:14px;border-radius:5px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent;cursor:pointer}
  .asset .pick.on{background:var(--accent);border-color:var(--accent);color:#111}
  .asset .more{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:6px;background:rgba(0,0,0,.6);color:#ddd;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
  .asset .more:hover{background:#333}
  .asset.addasset{cursor:pointer;align-items:center;justify-content:center;text-align:center}
  .asset.addasset .thumb{background:transparent;color:var(--mute);font-size:20px}
  .badge{position:absolute;top:4px;right:4px;font-size:9px;padding:1px 5px;border-radius:6px}
  .badge.up{background:rgba(52,211,153,.85);color:#062}
  .badge.ing{background:rgba(0,0,0,.7);color:#fde047}
  .badge.fail{background:rgba(248,113,113,.85);color:#fff}
  .drawer{width:300px;flex:none;align-self:stretch;background:#191919;border-left:1px solid rgba(255,255,255,.1);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
  .drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.1);font-size:12px;color:#ddd}
  .drawer .x{background:transparent;border:0;color:var(--dim);font-size:16px;cursor:pointer}
  .drawer .x:hover{color:#fff}
  .drawer .db{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
  .drawer .prev{background:#222;border-radius:12px;min-height:96px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:6px}
  .drawer .prev img{width:100%;object-fit:contain}
  .drawer .lab{font-size:11px;color:var(--mute);margin:4px 0 4px}
  .drawer .ainp{width:100%;background:var(--field2);border:1px solid transparent;border-radius:8px;padding:7px 9px;font-size:12px;color:var(--text);outline:none}
  .drawer .ainp:focus,.drawer .adesc:focus,.drawer .aprompt:focus{border-color:var(--dim)}
  .drawer .adesc{width:100%;min-height:70px;resize:vertical;background:var(--field2);border:1px solid transparent;border-radius:8px;padding:7px 9px;font-size:11px;color:var(--text);outline:none;line-height:1.5}
  .drawer .aprompt{width:100%;min-height:200px;resize:vertical;background:var(--field2);border:1px solid transparent;border-radius:8px;padding:7px 9px;font-size:11px;color:var(--text);outline:none;line-height:1.5}
  .drawer .dfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
  .drawer .dfoot .ghost{background:var(--hover);color:#ddd;font-size:11px;padding:7px 12px;border:0;border-radius:9px;cursor:pointer}
  .drawer .dfoot .save{background:var(--accent);color:#111;font-size:11px;padding:7px 12px;border:0;border-radius:9px;cursor:pointer}
  .agen-row{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
  .agen-row .ghost{background:var(--hover);color:#ddd;font-size:12px;padding:8px 14px;border:0;border-radius:9px;cursor:pointer}
  .agen-row .save{background:var(--accent);color:#111;font-size:12px;padding:8px 14px;border:0;border-radius:9px;cursor:pointer}

  /* ---- view3 list cards ---- */
  .vtabs{display:flex;gap:2px;background:var(--field);padding:3px;border-radius:10px;width:max-content;margin:0 auto 12px}
  .vtabs button{font-size:11px;padding:6px 14px;border:0;border-radius:8px;background:transparent;color:var(--dim);cursor:pointer}
  .vtabs button.on{background:var(--accent);color:#111}
  .bulk{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:12px}
  .bulk .lab{font-size:10px;color:var(--mute)}
  /* view3 列表卡片：顶部操作行 + 生图/生视频两栏文本 */
  .shotcard{display:flex;flex-direction:column;border:1px solid #2a2a2a;border-radius:12px;padding:14px 16px;margin-bottom:14px;background:#1a1a1a}
  .shot-top{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;margin-bottom:6px}
  .shot-id{display:flex;align-items:center;gap:10px;min-width:120px}
  .shot-id b{font-size:18px;color:#fff;font-family:"Songti SC",STSong,serif;font-weight:600}
  .shot-id .dur{font-size:11px;color:var(--mute);margin-left:2px}
  .shot-ops{display:flex;align-items:center;justify-content:center;gap:8px}
  .refresh{background:transparent;border:0;color:var(--mute);font-size:16px;cursor:pointer;padding:4px 8px;border-radius:6px;min-width:30px}
  .refresh:hover{background:var(--hover);color:#fff}
  .shot-body{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .genbox{display:flex;flex-direction:column;min-width:0}
  .genbox .gl{font-size:12px;color:#d4d4d4;margin-bottom:6px;font-weight:500}
  .prompt-edit{width:100%;min-height:60px;background:transparent;border:1px solid transparent;border-radius:9px;padding:8px 10px;font-size:12px;color:var(--text);outline:none;resize:vertical;line-height:1.6;transition:all .15s}
  .shotcard:hover .prompt-edit{background:var(--field)}
  .prompt-edit:hover{border-color:var(--line)}
  .prompt-edit:focus{background:var(--field);border-color:var(--dim)}
  .prompt-edit.large{min-height:100px;background:var(--field);padding:12px 14px}
  .prompt-text{font-size:12px;line-height:1.75;color:var(--text);min-height:200px;max-height:340px;overflow-y:auto;background:transparent;padding:2px 0;border-radius:0;white-space:pre-wrap;word-break:break-word;letter-spacing:.2px}
  /* 只读展示 + 双击弹窗编辑（复刻变更#15：避免原地 contentEditable 卡死） */
  .readonly-edit{color:#d4d4d4;font-size:11px;line-height:1.6;cursor:pointer;white-space:pre-wrap;word-break:break-word;transition:background .15s}
  .readonly-edit:hover{background:var(--field);outline:1px dashed var(--line);outline-offset:2px;border-radius:6px}
  .readonly-edit .at{color:var(--cyan);font-weight:500}
  .readonly-edit .tint{color:var(--mute);font-size:10px}
  .fe-actions{display:flex;gap:8px;align-items:center}
  .fe-actions .tb{font-size:11px}
  .prompt-text .at{color:var(--cyan);font-weight:500}
  .gridmode{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
  .gridmode button{font-size:12px;padding:5px 16px;border-radius:7px;background:transparent;color:var(--dim);border:0;cursor:pointer;font-weight:400}
  .gridmode button.on{background:var(--accent);color:#111;font-weight:500}
  .gridmode button:hover:not(.on){background:var(--hover);color:#fff}
  .add{margin-top:8px;display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:7px 12px;border-radius:10px;background:var(--field);color:var(--dim);border:0;cursor:pointer}
  .add:hover{background:var(--hover2);color:#ddd}

  /* single view（精确对齐截图 10.39.38） */
  .single-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.06)}
  .single-nav{display:flex;align-items:center;gap:4px}
  .single-nav .arrow{font-size:30px;font-weight:200;color:var(--mute);cursor:pointer;line-height:1;background:0;border:0;padding:0 4px}
  .single-nav .arrow:hover{color:#fff}
  .single-nav .arrow:disabled{opacity:.3;cursor:default}
  .single-nav .big{font-size:28px;color:#fff;font-family:"Songti SC",STSong,serif;font-weight:600;margin:0 6px}
  .single-nav .sub{font-size:14px;color:var(--mute);margin-left:4px}
  .single-actions{display:flex;align-items:center;gap:8px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field.full{grid-column:1/-1;margin-bottom:12px}
  .field>label{font-size:11px;color:var(--mute)}
  .field>input,.field .dropbtn{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--text);outline:none}
  .field>input:focus{border-color:var(--dim)}
  .field>input::placeholder{color:var(--mute)}
  .gen-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .gen-header>label{margin-bottom:0}
  .gridmode.inline{gap:4px}
  .gridmode.inline button{font-size:11px;padding:4px 12px}
  .prompt-text.large{font-size:12px;line-height:1.75;color:var(--text);min-height:120px;max-height:none;background:var(--field);padding:14px 16px;border-radius:10px}
  .dlgbox{display:flex;flex-direction:column;gap:6px}
  .dlg-add{display:flex;gap:6px;margin-top:4px}
  .dlrolewrap{display:flex;align-items:center;gap:4px;background:var(--field2);border:1px solid var(--line);border-radius:6px;padding:2px 4px 2px 8px}
  .dlrolelab{font-size:10px;color:var(--mute);flex:none}
  .dlrole{width:50px;background:transparent;border:0;font-size:10px;color:var(--text);outline:none;text-align:left;padding:5px 0}
  .dlrow{display:flex;align-items:center;gap:8px}
  .dlkind{width:52px;flex:none;font-size:10px;padding:5px;background:rgba(34,211,238,.2);color:var(--cyan);border:0;border-radius:6px;cursor:pointer}
  .dlkind.旁白{background:rgba(196,181,253,.2);color:var(--purple)}
  .dltxt{flex:1;background:var(--field2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:11px;color:var(--text);outline:none}
  .dldel{background:transparent;border:0;color:var(--mute);cursor:pointer;font-size:14px;padding:4px 8px}
  .dldel:hover{color:var(--red)}
  .field .cell-desc{background:var(--field);border-radius:10px;padding:14px 16px;min-height:80px;font-size:12px;line-height:1.7;color:var(--text);outline:none;cursor:text}
  .field .cell-desc:focus{border-color:var(--dim)}
  .refs{display:flex;align-items:center;gap:14px;background:#1b1b1b;border-radius:10px;padding:12px 16px;margin-bottom:14px}
  .refs .pics{display:flex}
  .ref-thumb{width:64px;height:64px;object-fit:cover;border:2px solid rgba(255,255,255,.9);border-radius:4px;box-shadow:0 8px 18px rgba(0,0,0,.38);background:#262626;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim);overflow:hidden}
  .ref-thumb:not(:first-child){margin-left:-22px}
  .refs .rmeta{min-width:0;flex:1}
  .refs .rmeta b{font-size:12px;color:#f3f4f6}
  .refs .rmeta small{display:block;font-size:10px;color:var(--mute);margin:3px 0}
  .refs .rnms{font-size:11px;color:#d1d5db;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* gen mask */
  .genmask{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:rgba(20,20,20,.75);border-radius:0 0 var(--radius) var(--radius)}
  .genmask .spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.25);border-top-color:#34d399;border-radius:50%;animation:sp .8s linear infinite}

}

const $=s=>document.querySelector(s);
function esc(s){return (s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function hlAt(text){ // @资产名 青色高亮

function renderSteps(){

  const data=[

  ];
  $("#steps").innerHTML=data.map((s,k)=>{

let __feCtx=null;   // 弹窗临时编辑状态（模块级，避免全局污染）
function openFieldEditor(shotIndex, field, label){
  const s=state.shots[shotIndex]; if(!s) return;
  const isDesc = field==='desc';
  const FIELDS={desc:{l:'画面描述',ph:'输入 @ 资产名 引用资产'},prompt:{l:'生图提示词',ph:'输入 @ 资产名 引用资产'},videoPrompt:{l:'生视频提示词',ph:'输入 @ 资产名 引用资产'}};
  const meta=FIELDS[field];
  const tempVal = { v: s[field] || '' };
  // 插入 @资产（从已生成资产里选，插入到光标处）
  const insertAsset=(name)=>{ const ta=document.getElementById('fe-input'); if(!ta) return; const s0=ta.selectionStart; const s1=ta.selectionEnd; const cur=tempVal.v.slice(0,s0)+'@'+name+' '+tempVal.v.slice(s1); tempVal.v=cur; ta.value=cur; ta.focus(); const pos=s0+name.length+2; ta.setSelectionRange(pos,pos); };
  const assetNames = (state.assets||[]).filter(a=>a.name).map(a=>a.name);
  const assetBtns = assetNames.length
    ? `<div style="margin:8px 0 4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center"><span style="font-size:10px;color:var(--mute)">插入资产：</span>${assetNames.map(n=>`<button class="tb light" onclick="openFieldEditorInsert('${n.replace(/'/g,"\\'")}')">@${esc(n)}</button>`).join('')}</div>`
    : '';
  __feCtx={tempVal,insertAsset};
  $("#overlay").innerHTML=`<div class="mask" onclick="if(event.target===this)closeFieldEditor()">
    <div class="modal" style="width:min(${isDesc?720:900}px,94vw);height:auto;max-height:90vh">

        <button class="tb light" style="margin-right:6px" onclick="fieldEditorFormat()" title="按标点自动拆行，方便查看">排版</button>

      <div class="mb" style="padding:14px">
        <textarea id="fe-input" class="prompt-edit large" style="min-height:${isDesc?140:240}px" placeholder="${meta.ph}">${esc(tempVal.v)}</textarea>

          <div class="fe-actions">
            <button class="tb light" onclick="closeFieldEditor()">取消</button>
            <button class="tb dark" onclick="fieldEditorSave(${shotIndex},'${field}')">保存</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function __dlgInsertAsset(name){
  if(!__dlgCtx) return;

  const last=__dlgCtx.list[__dlgCtx.list.length-1];
  last.text=(last.text?last.text+" ":"")+"@"+name;
  renderDialogueModal();
}
function __dlgSet(k,f,v){ if(!__dlgCtx) return; __dlgCtx.list[k][f]=v; }
function __dlgSetKind(k){ if(!__dlgCtx) return; const d=__dlgCtx.list[k]; d.kind=d.kind==='台词'?'旁白':'台词'; if(d.kind==='旁白') d.role=""; renderDialogueModal(); }
function __dlgDel(k){ if(!__dlgCtx) return; __dlgCtx.list.splice(k,1); renderDialogueModal(); }
function __dlgAdd(kind){ if(!__dlgCtx) return; __dlgCtx.list.push({kind,role:"",text:""}); renderDialogueModal(); }

/* ===== interactions ===== */

/* —— 生成中遮罩（全屏覆盖节点 + 右上角计时徽标） —— */
let genTimer=null, genAborted=false;
function showGenMask(text){
  state.genMask=true; state.genChars=0; state.genSecs=0; genAborted=false;
  showGenBadge(true);
  if(genTimer) clearInterval(genTimer);
  genTimer=setInterval(()=>{state.genSecs++;render();},1000);
  render();
}
function stopGen(){
  if(genTimer) clearInterval(genTimer);
  genAborted=true; state.genMask=false; showGenBadge(false);
  render();
}
function showGenBadge(on){$("#genbadge").style.display=on?'inline-flex':'none';}

/* —— 步骤1：生成剧本（剧情→分镜+资产，带全屏遮罩） —— */
function genScript(){
  if(!state.story.trim()){alert('请先输入剧情');return;}
  showGenMask("正在生成分镜脚本");
  setTimeout(()=>{                          // 模拟 AI 推理耗时
    if(genAborted){stopGen();return;}
    // 镜头数：auto=5，数字=该数
    let n = state.shotCount==='custom' ? (parseInt(state.customCount)||5)
            : state.shotCount==='auto' ? 5 : Number(state.shotCount);
    n=Math.min(Math.max(n,1),50);
    state.shots = fakeScriptEngine.buildShots(n);
    state.assets = fakeScriptEngine.buildAssets();
    state.projectName = (state.story||"剧本项目").replace(/[，。！？,.!?\s].*$/,'').slice(0,6) || "剧本项目";
    state.selShots=new Set(); state.cur=0;
    if(genTimer) clearInterval(genTimer);
    state.genMask=false; showGenBadge(false);
    state.step=1; render();
  }, 1200);
}

/* —— 步骤2：生成资产参考图（单资产/批量，模拟生图） —— */
function genAsset(k){
  const x=state.assets[k]; if(!x)return;
  if(!x.prompt) x.prompt=fakeScriptEngine.buildAssets().find(a=>a.name===x.name)?.prompt || (state.style+"，"+x.desc);
  x.loadingGen=true; render();
  setTimeout(()=>{ x.loadingGen=false; x.has=true; x.imageUrl=`https://picsum.photos/seed/${encodeURIComponent(x.name)}/400/400`; render(); }, 900);
}
function batchGen(){
  const ids=state.selAssets.size?[...state.selAssets]:state.assets.map((_,i)=>i);
  if(!ids.length){alert('没有可生成的资产');return;}
  ids.forEach(i=>{state.assets[i].loadingGen=true;});
  render();
  let done=0;
  const tick=()=>{done++;render();if(done<ids.length)setTimeout(tick,400);else{
    ids.forEach(i=>{state.assets[i].loadingGen=false;state.assets[i].has=true;
      state.assets[i].imageUrl=`https://picsum.photos/seed/${encodeURIComponent(state.assets[i].name)}/400/400`;});render();}};
  setTimeout(tick,300);
}

/* —— 步骤3：生成分镜提示词（单镜/批量，按源码导演模板拼装，数量贴近真实 400+ 字） —— */
const STYLE_SECTIONS = ["主体身份与外观","精确动作与姿态","角色间距离与视线关系","前中后景环境","关键道具位置","景别与构图","镜头焦段和视角","光源方向与明暗层次","色彩关系","材质纹理","空气透视","电影美术风格"];
function buildShotPrompts(s){
  const style = state.style || "电影感";
  const dlgLines = (s.dialogue||[]).map(d=> d.kind==="旁白" ? `旁白："${d.text}"` : `${d.role}说："${d.text}"`).join("，");
  const assetsHit = (s.desc||"").match(/@[\u4e00-\u9fa5A-Za-z0-9]+/g)||[];
  const assetsNames = assetsHit.map(a=>a.slice(1)).join("、");
  const assetsLine = assetsHit.length ? "本分镜涉及以下资源：" + assetsNames + "，请在画面中自然呈现，并在画面描述里用 @名称 逐字引用，不得删减改写" : "本分镜未引用具体资源，按画面描述生成即可，不要凭空加入无关角色/道具";
  const clean = (s.desc||"").replace(/@(\S+)/g,'$1').replace(/[。！]/g,'').trim();

  // prompt：按源码导演模板的「可见画面」要素完整展开，达到 400+ 字
  s.prompt = `${style}统一风格下的单帧画面：${clean}。` +
    `主体身份与外观清晰（${assetsNames||"画面主体"}），精确动作与姿态明确，角色间保持自然距离与视线呼应。` +
    `景别采用${s.shotType||"中景"}，构图遵循三分法则，主体置于视觉中心偏下，前中后景层次分明：前景利用（草叶/门框/虚化物体）增强纵深，中景承载主体动作，背景交代${s.lighting||"自然光"}环境。` +
    `镜头采用中焦段（50mm）平视视角，${s.lighting||"自然光"}从侧上方照射，形成柔和的明暗层次与轮廓光，阴影方向统一。` +
    `色彩关系严格贴合${style}风格，整体色调协调统一，材质表现细腻（皮毛/木纹/布料纹理清晰），空气透视自然，远处景物略微雾化。` +
    `关键道具与环境细节完整呈现，画面符合电影美术质感，光线柔和，细节丰富，无文字、水印、边框或多余元素。`;

  // videoPrompt：按「起始画面/运镜/焦点迁移/主体动作/次级运动/光影变化/节奏/结束画面」完整展开
  s.videoPrompt = `【时长 ${s.dur}秒】` +
    `起始画面：${style}统一色调下，${clean}，主体处于画面${s.shotType==="特写"?"中心特写位置":"三分构图中心"}。` +
    `镜头以${s.motion||"固定"}方式运动，运镜速度平稳，${s.motion==="推"?"缓慢推近放大主体":s.motion==="拉"?"逐渐拉远展现全貌":s.motion==="摇"?"横向摇摄扫过场景":s.motion==="跟"?"跟随主体平行移动":"保持固定视角"}，焦点随主体位置平稳迁移。` +
    `主体动作自然连贯，表情与视线变化明确，无跳切、瞬移或身份漂移。` +
    `衣物、毛发、草木等次级运动自然流畅，${s.sound?("同时伴随"+s.sound+"等环境声音氛围"):"环境声音贴合画面氛围"}。` +
    (dlgLines?("本镜对白/旁白："+dlgLines+"，说话时嘴型与台词同步。"):"本镜无对白旁白。") +
    `光影随时间有细微变化（${s.lighting||"自然光"}），${style}色调贯穿始终，动作节奏与情绪匹配，结束画面干净利落，为下一镜留有衔接余地。`;
}
function genShot(i){
  const s=state.shots.find(x=>x.index==i); if(!s)return;
  s.loading=true; render();
  setTimeout(()=>{ if(!s)return; s.loading=false;
    buildShotPrompts(s);
    render(); }, 800);
}
function batchPrompt(){
  const ids=[...state.selShots];
  const list=ids.length?ids:state.shots.map(s=>s.index);
  if(!list.length){alert('没有分镜');return;}
  list.forEach(idx=>{const s=state.shots.find(x=>x.index==idx);if(s)s.loading=true;});
  render();
  let done=0;
  const tick=()=>{done++;render();if(done<list.length)setTimeout(tick,300);else{
    list.forEach(idx=>{const s=state.shots.find(x=>x.index==idx);if(s){s.loading=false; buildShotPrompts(s);}});render();}};
  setTimeout(tick,300);
}

/* —— 连线：真实建下游节点卡片 + 记录连接 —— */
function connect(i,t){
  const s=state.shots.find(x=>x.index==i); if(!s)return;
  const type=t==='image'?'image':'video';
  const key=`${i}:${type}`;
  // 已连则断开
  const existing=state.connected.find(c=>c.shotId===i && c.type===type);
  if(existing){
    state.connected=state.connected.filter(c=>c!==existing);
    if(type==='image') s.connImg=false; else s.connVid=false;
    render(); return;
  }
  const nodeType = type==='image'?'promptNode':'discountVideoNode';
  const nodeId=`node-${type}-${i}-${Date.now()}`;
  state.connected.push({shotId:i, type, nodeType, nodeId});
  if(type==='image') s.connImg=true; else s.connVid=true;
  render();
}
function connectShots(t){
  const ids=state.view3==='single'?[state.shots[state.cur].index]:[...state.selShots];
  if(!ids.length){alert('请先勾选镜头');return;}
  ids.forEach(idx=>connect(idx,t));
  render();
}
/* 断开指定连接（供连线区删除按钮用） */
function disconnectShot(shotId,type){
  state.connected=state.connected.filter(c=>!(c.shotId===shotId&&c.type===type));
  const s=state.shots.find(x=>x.index===shotId);
  if(s){ if(type==='image')s.connImg=false; else s.connVid=false; }
  render();
}

/* —— 资产上传（模拟上传进度 + 失败可重试） —— */
function upOne(name){
  const a=state.assets.find(a=>a.name===name); if(!a)return;
  a.videoStatus="uploading"; render();
  setTimeout(()=>{ a.videoStatus= Math.random()<0.8 ? "uploaded" : "failed"; render(); },900);
}
function retryUp(name){ upOne(name); }
function uploadAllVideo(){
  const list=state.assets.filter(a=>a.has && a.videoStatus!=="uploaded");
  if(!list.length){alert('没有待上传的资产');return;}
  list.forEach(a=>a.videoStatus="uploading"); render();
  let done=0;
  const tick=()=>{done++;render();if(done<list.length)setTimeout(tick,400);else{
    list.forEach(a=>{a.videoStatus= Math.random()<0.85 ? "uploaded" : "failed";});render();}};
  setTimeout(tick,300);
}

/* —— 模型选择 —— */
function pickModel(m){state.model=m;state.modelOpen=false;render();}

/* —— 通用小交互 —— */
function pick(field,i,val){state.shots[i][field]=val;state._drop=null;render();}
function toggleAsset(k){state.selAssets.has(k)?state.selAssets.delete(k):state.selAssets.add(k);render();}
function openAsset(k){state.editingAsset=k;state.assetMenu=null;render();}
function addAsset(cat){state.assets.push({name:"新"+(cat==='character'?'角色':cat==='scene'?'场景':'道具'),cat,has:false,loading:false,loadingGen:false,desc:"",prompt:"",imageUrl:"",videoStatus:""});render();}
function delAsset(k){state.assets.splice(k,1);state.editingAsset=null;render();}
/* 资产改名联动（复刻真实系统 J 函数）：改 name 时，把所有分镜里 @旧名 → @新名，保持引用同步 */
function renameAsset(k,newName){
  const a=state.assets[k]; if(!a) return;
  const old=a.name.trim(); const nn=(newName||"").trim();
  if(!nn || nn===old) { if(!nn) a.name=old; render(); return; }
  a.name=nn;
  const re=new RegExp('@'+old.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');
  (state.shots||[]).forEach(s=>{
    if(s.desc) s.desc=s.desc.replace(re,'@'+nn);
    if(s.prompt) s.prompt=s.prompt.replace(re,'@'+nn);
    if(s.videoPrompt) s.videoPrompt=s.videoPrompt.replace(re,'@'+nn);
    (s.dialogue||[]).forEach(d=>{ if(d.text) d.text=d.text.replace(re,'@'+nn); });
  });
  render();
}
function addDlg(i,kind){state.shots[i].dialogue.push({kind,role:kind==='台词'?'': '',text:""});render();}
function delDlg(i,k){state.shots[i].dialogue.splice(k,1);render();}
function toggleDlg(i,k){const d=state.shots[i].dialogue[k];d.kind=d.kind==='台词'?'旁白':'台词';if(d.kind==='旁白')d.role='';render();}
function setDlg(i,k,field,val){state.shots[i].dialogue[k][field]=val;render();}
function addShot(){
  const n=state.shots.length+1;
  state.shots.push({index:n,dur:3,desc:"新增镜头描述，可输入 @ 引用资产。",shotType:"中景",lighting:"自然光",dialogue:[],sound:"",motion:"固定",grid:0,prompt:"",videoPrompt:"",connImg:false,connVid:false,loading:false});
  render();
}
function delShot(i){state.shots.splice(i,1);state.shots.forEach((s,k)=>s.index=k+1);render();}
/* 清空当前步骤数据（步骤1清剧本、步骤3清连线等） */
function resetStep(){
  if(state.step===1){ state.shots=[]; state.assets=[]; state.projectName=""; }
  else if(state.step===3){ state.connected=[]; state.shots.forEach(s=>{s.connImg=false;s.connVid=false;}); }
  render();
}

/* ===== root ===== */
function render(){
  if(!$("#steps")||!$("#view")) return;
  renderSteps();
  if(state.step===1) $("#view").innerHTML=renderV1();
  else if(state.step===2) $("#view").innerHTML=renderV2();
  else $("#view").innerHTML=renderV3();
  // 统一生成中遮罩：覆盖整个节点 + 停止按钮 + 计时
  const nm=$(".node");
  if(nm){
    let m=$(".genmask");
    if(state.genMask){
      if(!m){ m=document.createElement("div"); m.className="genmask"; nm.appendChild(m); }
      const label = state.step===1 ? "正在生成分镜脚本" : state.step===3 ? "正在生成分镜提示词" : "正在处理…";
      m.innerHTML=`<div class="spin"></div><div>${label}… 已用 ${state.genSecs||0}s</div>
        <button class="stopbtn" onclick="stopGen()">停止生成</button>`;
    } else if(m){ m.remove(); }
  }
  // 步骤2/3 右上角计时徽标数字
  const gb=$("#gbSecs"); if(gb) gb.textContent=state.genSecs;
}
render();
</script>
</body>
