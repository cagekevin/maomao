<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>剧本盒子 · 提示词链路图</title>
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #14171c;
        --panel2: #1a1e25;
        --line: #262c36;
        --text: #e6e9ef;
        --dim: #8b93a3;
        --dim2: #616b7d;
        --textflow: #5aa9ff;
        --promptflow: #f0b23c;
        --imgflow: #4ade80;
        --bypass: #a78bfa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.6 -apple-system,
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
      }
      header {
        padding: 18px 24px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }
      .sub {
        color: var(--dim2);
        font-size: 12px;
      }
      .spacer {
        flex: 1;
      }
      .toggle {
        background: var(--panel2);
        border: 1px solid var(--line);
        color: var(--dim);
        padding: 6px 14px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 12px;
      }
      .toggle.on {
        background: #1f3a2a;
        border-color: #2d5c41;
        color: #7ee2a8;
      }

      main {
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 0;
        height: calc(100vh - 61px);
      }
      .flow {
        padding: 20px 16px 60px;
        overflow-y: auto;
        border-right: 1px solid var(--line);
      }
      .detail {
        padding: 22px 28px 60px;
        overflow-y: auto;
      }

      /* ── 步骤卡 ── */
      .step {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        cursor: pointer;
        transition: 0.15s;
        position: relative;
      }
      .step:hover {
        border-color: #3a4250;
      }
      .step.active {
        border-color: #4ade80;
        background: #16211b;
        box-shadow: 0 0 0 1px #4ade8033;
      }
      .step .top {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .num {
        width: 20px;
        height: 20px;
        border-radius: 5px;
        background: var(--panel2);
        color: var(--dim);
        font-size: 11px;
        display: grid;
        place-items: center;
        flex: none;
      }
      .step.active .num {
        background: #1f3a2a;
        color: #7ee2a8;
      }
      .name {
        font-weight: 600;
        font-size: 13px;
      }
      .badge {
        margin-left: auto;
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 4px;
        background: var(--panel2);
        color: var(--dim2);
      }
      .io {
        margin-top: 8px;
        font-size: 11.5px;
        color: var(--dim);
        line-height: 1.7;
      }
      .io b {
        color: var(--text);
        font-weight: 500;
      }
      .k {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
      .k.in {
        color: var(--textflow);
      }
      .k.out {
        color: var(--imgflow);
      }

      /* ── 连线 ── */
      .arrow {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 0 7px 30px;
        font-size: 11px;
        font-family: ui-monospace, Menlo, monospace;
      }
      .arrow .bar {
        width: 2px;
        height: 14px;
        background: var(--line);
        margin-left: -16px;
        flex: none;
      }
      .arrow .lbl {
        padding: 2px 8px;
        border-radius: 4px;
        background: var(--panel2);
        border: 1px solid var(--line);
      }
      .arrow.t .lbl {
        color: var(--textflow);
        border-color: #1e3550;
        background: #101c28;
      }
      .arrow.p .lbl {
        color: var(--promptflow);
        border-color: #3d2f14;
        background: #1e180e;
      }
      .arrow.i .lbl {
        color: var(--imgflow);
        border-color: #1c3a29;
        background: #0f1c15;
      }
      .arrow.b .lbl {
        color: var(--bypass);
        border-color: #2e2547;
        background: #171426;
      }
      .arrow.dash .bar {
        background: repeating-linear-gradient(var(--line) 0 3px, transparent 3px 6px);
      }

      .legend {
        margin-top: 18px;
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 11px;
        color: var(--dim2);
        line-height: 1.9;
      }
      .legend i {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        margin-right: 6px;
      }

      /* ── 详情 ── */
      .dtitle {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .dcode {
        font-size: 12px;
        color: var(--dim2);
        font-family: ui-monospace, Menlo, monospace;
      }
      .block {
        margin-top: 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
      }
      .bt {
        font-size: 12px;
        font-weight: 600;
        color: var(--dim);
        letter-spacing: 0.5px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .bt span.tag {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--panel2);
        color: var(--dim2);
        font-weight: 400;
      }
      .row {
        display: flex;
        gap: 10px;
        padding: 5px 0;
        border-top: 1px dashed var(--line);
        font-size: 12.5px;
      }
      .row:first-of-type {
        border-top: 0;
      }
      .row .rk {
        color: var(--dim2);
        width: 76px;
        flex: none;
      }
      .row .rv {
        color: var(--text);
      }
      pre {
        margin: 8px 0 0;
        background: #0d1014;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 11px 13px;
        font:
          11.5px/1.75 ui-monospace,
          Menlo,
          monospace;
        color: #c8d0dd;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 280px;
        overflow: auto;
      }
      .note {
        margin-top: 10px;
        font-size: 11.5px;
        color: var(--dim2);
        border-left: 2px solid var(--bypass);
        padding-left: 10px;
      }
      .tb {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        margin-top: 4px;
      }
      .tb th {
        text-align: left;
        color: var(--dim2);
        font-weight: 500;
        padding: 6px 8px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .tb td {
        padding: 7px 8px;
        border-bottom: 1px dashed var(--line);
        vertical-align: top;
        color: var(--dim);
      }
      .tb td:first-child {
        color: var(--text);
      }
      .tb tr:last-child td {
        border-bottom: 0;
      }
      .ex {
        display: none;
      }
      body.showex .ex {
        display: block;
      }
      .hint {
        color: var(--dim2);
        font-size: 12px;
        margin-top: 6px;
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
          height: auto;
        }
        .flow {
          border-right: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>剧本盒子 · 提示词链路图</h1>
        <div class="sub">点左边任意一步 → 看它吃进去什么、发给模型什么、吐出来落到哪个字段</div>
      </div>
      <div class="spacer"></div>
      <button class="toggle" id="exBtn">显示「小红帽」实例</button>
    </header>

    <main>
      <div class="flow" id="flow"></div>
      <div class="detail" id="detail"></div>
    </main>

    <script>
      const C = {
        t: 'var(--textflow)',
        p: 'var(--promptflow)',
        i: 'var(--imgflow)',
        b: 'var(--bypass)',
      };

      const STEPS = [
        {
          n: '①',
          name: '生成剧本',
          tag: '文本模型',
          fn: 'onGenerateScript · scriptBoxEngine.js:196',
          io: '<b>吃</b> <span class="k in">story</span> + 上游文本/图片<br><b>吐</b> <span class="k out">shots[]</span> <span class="k out">assets[]</span>',
          sys: [
            ['playbook.script', '剧本模板（齿轮可编辑，默认 workflows.manga.script）'],
            ['SCRIPT_WRITER_FORMAT', '固定 JSON 输出契约，永远追加，不可改（prompts.js:26）'],
            ['镜头数量要求', '约 N 镜 / 自动（:222-224）'],
            ['统一视觉风格', '填了 globalStyle 才追加，并要求模型原样回吐（:226-228）'],
          ],
          fmt: '<b>① system 里的输出格式约束 = SCRIPT_WRITER_FORMAT（prompts.js:26-30，写死，不可改）</b>\n要求模型严格输出一个 JSON 对象（只返回纯 JSON，不要解释、不要 Markdown 代码块）：\n{\n  "projectName":"2至8个中文字符",\n  "globalStyle":"整部片子的统一视觉风格",\n  "logline":"一句话故事核心（可选）",\n  "shots":[{"index":1,"duration":"5s","description":"…只对已注册资产用 @名称 引用…",\n           "shotType":"景别","lighting":"光影氛围","dialogue":"对白或旁白","sound":"音效","motion":"运镜"}],\n  "assets":[{"category":"character|scene|prop","name":"名称","description":"主体外观描述"}]\n}\n【硬性要求】故事中出现的所有场景必须全部注册为 scene；每个分镜 description 必须 @ 引用其发生的场景；\nassets 的 name 必须与 shots 的 description 里 @ 引用的名称完全一致。\n\n<b>引擎侧还有两道保险</b>：\n· 模型支持时强制 response_format = json_object（useJsonObject，:238）\n· parseJsonText 解析失败 → 提示「JSON 不完整或格式有误」；解析出 0 个可用分镜 → 提示「格式不符」，都不写回',
          user: 'story 原文（data.story + "\\n\\n" + data.upstreamStory）\n（上游图片走 images 参数，随消息一起发给模型看图）',
          out: [
            ['shots[]', 'description / duration / shotType / lighting / motion / dialogue / sound'],
            ['assets[]', 'name / description / prompt'],
            [
              'assets[i].prompt',
              '= "[视觉风格：X]" + description + "。" + 资产模板（ZgPrompt，prompts.js:73）',
            ],
            ['globalStyle', '用户填的优先，否则用模型返回的'],
          ],
          note: '<b>再点一次「生成剧本」会怎样？</b>整表覆盖：shots[] 和 assets[] 全量替换（:314-322），已生成的资产图（imageUrl）会丢，第 ③ 步产出的 prompt/videoPrompt 也会丢，pickedCount 归零。只有 data.story 写回你手填的那部分（上游文本不并进去，:316）。\n其它细节：模型返回的 dialogue 是字符串，这里会转成数组（normalizeDialogue）；duration 缺省补 "5s"；projectName 取模型返回值截 20 字，没有就从剧情前 8 字截；分镜 id 重新生成 `${nodeId}-shot-${n}`。上游图片只走 images 参数发出去，提示词里没有任何关于图的文字说明。',
          ex_sys:
            '【漫剧·剧本模板全文】\n+【输出格式】{"projectName":…,"globalStyle":…,"shots":[…],"assets":[…]}\n+【镜头数量要求】请严格生成约 2 个分镜\n+【统一视觉风格】中世纪童话·皮克斯3D',
          ex_user: '小红帽提着竹篮走进森林',
          ex_out:
            '{\n "projectName":"小红帽",\n "globalStyle":"中世纪童话·皮克斯3D",\n "shots":[{ "index":1,"duration":"5s",\n   "description":"@小红帽 提着 @竹篮 站在 @幽暗森林 的入口，回头张望",\n   "shotType":"全景","lighting":"逆光","sound":"鸟鸣" }, …],\n "assets":[\n   {"category":"character","name":"小红帽","description":"约十岁女孩，红色连帽斗篷，金色麻花辫"},\n   {"category":"scene","name":"幽暗森林","description":"高大针叶林，地面厚苔藓，斜射光束"},\n   {"category":"prop","name":"竹篮","description":"藤编圆篮，盖着红格布"}]\n}\n\n→ assets[0].prompt =\n[视觉风格：中世纪童话·皮克斯3D]约十岁女孩，红色连帽斗篷，金色麻花辫。专业角色设定图，横向三格并列：① 脸部正面特写…② 正面半身像…③ 全身正面站立像…',
        },
        {
          n: '②',
          name: '资产生图',
          tag: '图像模型',
          fn: 'onGenerateAssetImage · scriptBoxEngine.js:331',
          io: '<b>吃</b> <span class="k in">assets[i].prompt</span><br><b>吐</b> <span class="k out">assets[i].imageUrl</span>',
          sys: [['（无 system）', '生图只发一条 prompt，不加系统提示词']],
          fmt: '<b>无输出格式约束</b>：生图模型只回图片 URL，不存在「返回什么格式」的问题。\n引擎侧判定：r.ok 且有 r.url 才算成功（:370），否则按失败处理并记 imageStatus。',
          user: 'assets[i].prompt 原文\n（若为空，才用 name + description 现拼一次 ZgPrompt）',
          out: [
            ['assets[i].imageUrl', '落盘到素材库 /files/migrated/{人物|场景|道具}/'],
            ['assets[i].thumbnailUrl', '同图，显示时按需出小图'],
          ],
          note: '这张图后面不进任何提示词文本，只在最后一步作为「参考图」垫给生图/生视频模型。',
          ex_user:
            '[视觉风格：中世纪童话·皮克斯3D]约十岁女孩，红色连帽斗篷，金色麻花辫。专业角色设定图，横向三格并列：① 脸部正面特写（肩部以上，五官清晰、不裁切）② 正面半身像（腰部以上）③ 全身正面站立像（头至脚完整入画）。纯白背景，中性影棚平光…',
          ex_out: 'assets[0].imageUrl = /files/migrated/人物/小红帽.png',
        },
        {
          n: '③',
          name: '分镜提示词（一次出两条）',
          tag: '文本模型',
          fn: 'onGenerateShotPrompts · scriptBoxEngine.js:449',
          io: '<b>吃</b> <span class="k in">shots[i] 全部资料</span> + @资产名<br><b>吐</b> <span class="k out">图片提示词 prompt</span> ＋ <span class="k out">视频提示词 videoPrompt</span>',
          sys: [
            ['playbook.shot', '分镜导演模板（齿轮可编辑，默认 workflows.manga.shot）'],
            ['playbook.qg', '不可覆盖规则，追加在 shot 之后，最高优先（:466-468）'],
          ],
          fmt: '<b>③ 的输出格式约束分散在三处，都对模型强制</b>\n\n<span style="color:#f0b23c">A. system 末尾（两个模板各自带）</span>\n· 分镜导演模板末尾：「只返回可解析的纯 JSON，不要解释，不要 Markdown，不要在 JSON 前后添加任何文字」（workflows.js:74）\n· 不可覆盖规则 QG 末尾：「只返回包含 prompt、videoPrompt 的纯 JSON」（workflows.js:98）\n\n<span style="color:#f0b23c">B. user 尾部（assembleShotUser 最后一段，prompts.js:1336）</span>\nprompt 只描述可见画面（主体/动作/场景/景别/光影/色彩/视角/材质/焦段），\n不要包含对白、旁白、音效、字幕等文字信息；\nvideoPrompt 在 prompt 画面基础上补充镜头连续运动与动态，并把对白/旁白/环境三层音效按\n「具体角色名说：……」「环境层/拟音层/人声层：……」的结构自然融入；\n只返回包含 prompt、videoPrompt 两个字段的纯 JSON。\n\n<span style="color:#f0b23c">C. 引擎追加的硬格式（:512）</span>\nvideoPrompt 必须以「【时长 N秒】」单独一行开头，随后换行书写视频内容。\n\n<b>引擎侧校验</b>：JSON 合法但 prompt 和 videoPrompt 都缺 → 判为「格式不符」，<b>不写回空值</b>（:543-549）；\n只有一个字段时另一个存空串（:550-551）；开了尾帧连续时，输出里没带 @图片1 会被强制补一行（:555-562）。',
          user: 'assembleShotUser(shot, refAssets, globalStyle)（:501）\n  镜头编号 / 时长 / 景别 / 光影 / 运镜 / 统一风格\n  位置：第 N 镜 / 共 M 镜（开场镜·中段镜·结尾镜）\n  画面描述 = shots[i].description\n  【剧情上下文】上一镜承接 · 本镜职责 · 下一镜钩子\n  【出场分工】@角色（核心/压迫位/背景位）· @场景 · @道具\n  【风格锚定】【眼线锁定】【对白+环境音三层】\n  【负面黑名单】通用 + playbook.negative.image / video   ← 负面词在这里，user 中段\n+ 【生图强制约束，仅作用于 prompt】constraints.image    ← 正向约束在这里，user 尾部（:510）\n+ 【生视频强制约束，仅作用于 videoPrompt】constraints.video（:511）\n+ videoPrompt 必须以「【时长 N秒】」开头（:512）\n+ 你的修改意见 feedback（有则加，当前 UI 没传）',
          out: [
            ['shots[i].prompt', '<b>图片</b>提示词 → 第 ⑦ 步「生图」原样发出'],
            ['shots[i].videoPrompt', '<b>视频</b>提示词 → 第 ⑦ 步「生视频」原样发出'],
            [
              '一次调用，两条一起',
              '同一个 JSON 的两个字段。界面上「生成提示词 / 重新生成 / 批量生成提示词」三个按钮走的是同一个函数，都会同时刷新这两条；<b>没有「只生成图片」或「只生成视频」的入口</b>',
            ],
            [
              '覆盖方式',
              '整条覆盖。旧值不会发给模型（:501-513 的 user 里不含 prompt/videoPrompt 旧值），模型是凭本镜资料重新写一遍',
            ],
          ],
          note: '这一步模型只看到 @名字 和分工，看不到图（refAssets 只取 name/category，:491-492）。另：代码里 feedback（修改意见）参数存在，但当前三个调用点都没传，所以「生成提示词」不带意见；带意见的改写走第 ⑤ 步审计。',
          ex_sys:
